name: Verify file type registration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Install Linux desktop tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shared-mime-info libglib2.0-bin
      - name: Verify native registration lifecycle with generated fixtures
        run: npm run test:registration
