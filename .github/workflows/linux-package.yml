name: Verify Linux package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the exact Debian package
        required: true
        default: v1.6.3
      deb_sha256:
        description: Expected SHA-256 of Slide-Studio-linux-amd64.deb
        required: true
permissions:
  # GitHub requires write-level repository access to read unpublished draft assets.
  # This verification workflow downloads only; it never edits the release.
  contents: write
jobs:
  install-run-uninstall:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install disposable desktop test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox dbus-x11 desktop-file-utils
      - name: Download, install and exercise the public package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_DEB_SHA256: ${{ inputs.deb_sha256 }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/slide-studio-config
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export EXPECTED_APP_VERSION="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/slide-downloads" --pattern Slide-Studio-linux-amd64.deb
          bash scripts/qa-linux-package.sh "$RUNNER_TEMP/slide-downloads/Slide-Studio-linux-amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-verification-${{ matrix.os }}
          path: qa/results/linux-native/
