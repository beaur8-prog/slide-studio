name: Verify PPTX object presence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  object-presence:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_JSON_OUTPUT_NAME: qa/results/object-presence-ci.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify pictures, shape fills, safe ZIP endings and hostile input rejection
        run: >-
          npx playwright test
          tests/picture-presence.spec.ts
          tests/shape-picture-fill.spec.ts
          tests/pptx-zip-ending.spec.ts
          tests/io.spec.ts
          --reporter=line,json --output=qa/results/object-presence-ci-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: object-presence-${{ matrix.os }}
          path: qa/results/
          retention-days: 7
