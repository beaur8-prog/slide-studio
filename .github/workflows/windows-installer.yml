name: Verify Windows installer
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release containing the installer
        required: true
        default: v1.6.9
      setup_sha256:
        description: Expected SHA-256 of Slide-Studio-Setup-x64.exe
        required: true
      portable_sha256:
        description: Expected SHA-256 of the matching Windows ZIP
        required: true
permissions:
  # GitHub requires write-level repository access to read unpublished draft assets.
  # This verification workflow downloads only; it never edits the release.
  contents: write
jobs:
  install-update-uninstall:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download and verify the exact public installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SETUP_SHA256: ${{ inputs.setup_sha256 }}
          PORTABLE_SHA256: ${{ inputs.portable_sha256 }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $downloads = Join-Path $env:RUNNER_TEMP 'slide-studio-downloads'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $downloads --pattern Slide-Studio-Setup-x64.exe --pattern Slide-Studio-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          ./scripts/qa-windows-setup.ps1 -Setup (Join-Path $downloads 'Slide-Studio-Setup-x64.exe') -Portable (Join-Path $downloads 'Slide-Studio-win-x64.zip') -ExpectedSetupSHA256 $env:SETUP_SHA256 -ExpectedPortableSHA256 $env:PORTABLE_SHA256 -Version ($env:RELEASE_TAG.Substring(1))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-installer-verification
          path: qa/results/windows-setup-native/
