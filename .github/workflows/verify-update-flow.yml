name: Verify manual updates and visible Windows installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updates:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_JSON_OUTPUT_NAME: qa/results/update-ui-windows.json
      STUDIO_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:updates
      - run: npx playwright install chromium
      - name: Verify update controls and document protection
        run: npx playwright test tests/updates-ui.spec.ts tests/native-files.spec.ts tests/windows-ui.spec.ts tests/user-document-protection.spec.ts --reporter=line,json --output=qa/results/update-ui-artifacts
      - run: choco install nsis --no-progress -y
      - run: npm run build
      - run: node scripts/package-win.cjs
      - run: node scripts/package-win-setup.cjs
      - name: Exercise the real Windows installation progress helper
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          ./scripts/qa-update-progress-windows.ps1 -Setup (Join-Path $PWD 'release/Slide-Studio-Setup-x64.exe') -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: update-verification-windows
          retention-days: 7
          # Reports only, no installer, app archive or user documents.
          path: |
            qa/results/update-ui-windows.json
            qa/results/update-ui-artifacts/**/*.png
            qa/results/update-ui-artifacts/**/trace.zip
            qa/results/update-native-windows/*.json
