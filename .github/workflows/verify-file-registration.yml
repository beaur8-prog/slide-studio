name: Verify file type registration
on:
  workflow_dispatch:
    inputs:
      installer_ref:
        description: Optional full commit SHA of an older installer for before/after regression checks
        required: false
        type: string
permissions:
  contents: read
jobs:
  registration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Select older installer for regression comparison
        if: runner.os == 'Windows' && inputs.installer_ref != ''
        shell: pwsh
        env:
          INSTALLER_REF: ${{ inputs.installer_ref }}
        run: |
          if ($env:INSTALLER_REF -notmatch '^[a-f0-9]{40}$') { throw 'A full commit SHA is required' }
          git fetch --depth=1 origin $env:INSTALLER_REF
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch installer revision' }
          $source = git show "$($env:INSTALLER_REF):scripts/windows-installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read installer source' }
          Set-Content scripts/windows-installer.nsi -Value $source -Encoding utf8NoBOM
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Install Linux desktop tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils shared-mime-info libglib2.0-bin
      - name: Verify native registration lifecycle with generated fixtures
        run: npm run test:registration
