name: Verify editor core on Windows and Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_JSON_OUTPUT_NAME: qa/results/editor-core-ci.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Electron 42 ships an explicit installer rather than an npm postinstall.
      - name: Install checksum-verified native Electron runtime
        run: node node_modules/electron/install.js
      - run: npx playwright install --with-deps chromium
      - name: Install isolated Linux desktop
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
      - name: Build production renderer
        id: build
        run: npm run build
      - name: Verify file handling and presentation behavior
        run: >-
          npx playwright test
          tests/file-contexts.spec.ts
          tests/save-current-file.spec.ts
          tests/native-save-folders.spec.ts
          tests/native-files.spec.ts
          tests/save-context-ui.spec.ts
          tests/pptx-save.spec.ts
          tests/browser-output.spec.ts
          tests/recovery-storage.spec.ts
          tests/audio.spec.ts
          tests/native-menu-history.spec.ts
          tests/presentation-start-input.spec.ts
          tests/presentation-fullscreen.spec.ts
          tests/windows-ui.spec.ts
          --reporter=line,json --output=qa/results/editor-core-artifacts
      - name: Exercise real Windows production app with disposable files
        if: always() && steps.build.outcome == 'success' && runner.os == 'Windows'
        env:
          QA_APP_ROOT: ${{ github.workspace }}
        run: node scripts/qa-save-native.cjs node_modules/electron/dist/electron.exe qa/results/editor-core-native
      - name: Verify Linux native menu Undo and Redo
        if: always() && steps.build.outcome == 'success' && runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test tests/native-menu-history.spec.ts --reporter=line --output=qa/results/editor-core-native-history
      - name: Exercise real Linux production app with disposable files
        if: always() && steps.build.outcome == 'success' && runner.os == 'Linux'
        env:
          QA_APP_ROOT: ${{ github.workspace }}
          QA_NO_SANDBOX: '1'
        run: xvfb-run --auto-servernum node scripts/qa-save-native.cjs node_modules/electron/dist/electron qa/results/editor-core-native
      - name: Verify Windows MP3 AAC WAV playback and PDF with synthetic media
        if: always() && steps.build.outcome == 'success' && runner.os == 'Windows'
        env:
          QA_APP_ROOT: ${{ github.workspace }}
        run: node scripts/qa-audio-native.cjs node_modules/electron/dist/electron.exe tests/fixtures/media/native-audio.pptx qa/results/editor-core-audio
      - name: Verify Linux MP3 AAC WAV playback and PDF with synthetic media
        if: always() && steps.build.outcome == 'success' && runner.os == 'Linux'
        env:
          QA_APP_ROOT: ${{ github.workspace }}
          QA_NO_SANDBOX: '1'
        run: xvfb-run --auto-servernum node scripts/qa-audio-native.cjs node_modules/electron/dist/electron tests/fixtures/media/native-audio.pptx qa/results/editor-core-audio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: editor-core-verification-${{ runner.os }}
          retention-days: 7
          if-no-files-found: ignore
          # Reports and screenshots only; no app bundles or installers.
          path: |
            qa/results/editor-core-ci.json
            qa/results/editor-core-native/*.json
            qa/results/editor-core-native/*.png
            qa/results/editor-core-audio/*.json
            qa/results/editor-core-audio/*.png
            qa/results/editor-core-artifacts/**/*.png
            qa/results/editor-core-artifacts/**/trace.zip
            qa/results/editor-core-native-history/**/*.png
            qa/results/editor-core-native-history/**/trace.zip
