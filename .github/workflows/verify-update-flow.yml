name: Verify manual updates and visible Windows installation
on:
  workflow_dispatch:
    inputs:
      published_fixture:
        description: Use checksum-verified latest published Setup to diagnose the current helper without rebuilding
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  handoff:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      STUDIO_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Reject unregistered, copied and inconsistent installation targets
        shell: pwsh
        run: '& "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -File scripts/qa-windows-update-target.ps1'
      - name: Verify packaged Electron quit, acknowledgement, cancellation and failed helper startup
        run: node scripts/qa-update-handoff-windows.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: update-handoff-windows
          retention-days: 7
          # Disposable fixture reports only; no app, installer or user documents.
          path: |
            qa/results/update-handoff-windows/**/*.json
            qa/results/update-handoff-windows/**/*.log
            qa/results/update-handoff-windows/**/*.png
            qa/results/update-target-windows/*.json
  updates:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_JSON_OUTPUT_NAME: qa/results/update-ui-windows.json
      STUDIO_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:updates
      - run: npx playwright install chromium
      - name: Verify update controls and document protection
        run: npx playwright test tests/updates-ui.spec.ts tests/native-files.spec.ts tests/windows-ui.spec.ts tests/user-document-protection.spec.ts --reporter=line,json --output=qa/results/update-ui-artifacts
      - run: choco install nsis --no-progress -y
        if: inputs.published_fixture != true
      - run: npm run build
        if: inputs.published_fixture != true
      - run: node scripts/package-win.cjs
        if: inputs.published_fixture != true
      - run: node scripts/package-win-setup.cjs
        if: inputs.published_fixture != true
      - name: Acquire a checksum-verified older Setup for an actual version upgrade
        if: inputs.published_fixture != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory release/baseline -Force | Out-Null
          gh api repos/beaur8-prog/slide-studio/releases/latest | Set-Content release/baseline/release.json -Encoding utf8NoBOM
          if ($LASTEXITCODE) { throw 'Cannot read the published baseline release.' }
          $tag = (Get-Content release/baseline/release.json -Raw | ConvertFrom-Json).tag_name
          gh release download $tag --repo beaur8-prog/slide-studio --pattern Slide-Studio-Setup-x64.exe --dir release/baseline
          if ($LASTEXITCODE) { throw 'Baseline installer download failed.' }
          node -e 'const fs=require("node:fs");const {selectRelease,verifyFile}=require("./electron/studio-updater.cjs");const asset=selectRelease(JSON.parse(fs.readFileSync("release/baseline/release.json","utf8")),{id:"slide",currentVersion:"0.0.0",platform:"win32",arch:"x64"});verifyFile("release/baseline/Slide-Studio-Setup-x64.exe",asset).then(()=>fs.writeFileSync("release/baseline/fixture.json",JSON.stringify({version:asset.version}))).catch(error=>{console.error(error);process.exitCode=1;});'
          if ($LASTEXITCODE) { throw 'Baseline installer checksum mismatch.' }
      - name: Acquire a verified published installer for helper diagnosis
        if: inputs.published_fixture == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          gh api repos/beaur8-prog/slide-studio/releases/latest | Set-Content release/fixture-release.json -Encoding utf8NoBOM
          if ($LASTEXITCODE) { throw 'Cannot read the published fixture release.' }
          $tag = (Get-Content release/fixture-release.json -Raw | ConvertFrom-Json).tag_name
          gh release download $tag --repo beaur8-prog/slide-studio --pattern Slide-Studio-Setup-x64.exe --dir release
          if ($LASTEXITCODE) { throw 'Fixture installer download failed.' }
          node -e 'const fs=require("node:fs");const {selectRelease,verifyFile}=require("./electron/studio-updater.cjs");const asset=selectRelease(JSON.parse(fs.readFileSync("release/fixture-release.json","utf8")),{id:"slide",currentVersion:"0.0.0",platform:"win32",arch:"x64"});verifyFile("release/Slide-Studio-Setup-x64.exe",asset).then(()=>fs.writeFileSync("release/fixture.json",JSON.stringify({version:asset.version}))).catch(error=>{console.error(error);process.exitCode=1;});'
      - name: Exercise the real Windows installation progress helper
        shell: pwsh
        run: |
          $version = if (Test-Path release/fixture.json) { node -p 'require("./release/fixture.json").version' } else { node -p 'require("./package.json").version' }
          $baseline = if (Test-Path release/baseline/Slide-Studio-Setup-x64.exe) { @{BaselineSetup=(Join-Path $PWD 'release/baseline/Slide-Studio-Setup-x64.exe'); BaselineVersion=(node -p 'require("./release/baseline/fixture.json").version')} } else { @{} }
          ./scripts/qa-update-progress-windows.ps1 -Setup (Join-Path $PWD 'release/Slide-Studio-Setup-x64.exe') -Version $version @baseline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && inputs.published_fixture != true
        with:
          name: verified-update-installer-windows
          retention-days: 7
          path: |
            release/Slide-Studio-Setup-x64.exe
            release/Slide-Studio-win-x64.zip
            release/BUILD-win-setup-x64.json
            release/BUILD-win-x64.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: update-verification-windows
          retention-days: 7
          # Reports only, no installer, app archive or user documents.
          path: |
            qa/results/update-ui-windows.json
            qa/results/update-ui-artifacts/**/*.png
            qa/results/update-ui-artifacts/**/trace.zip
            qa/results/update-native-windows/*.json
            qa/results/update-native-windows/*.log
            qa/results/update-native-windows/*.png
